name: FUEL Worker build
on:
  pull_request:
    paths:
      - "cloudflare/fuel-chatgpt-api/**"
      - ".github/workflows/fuel-worker-check.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/fuel-chatgpt-api/**"
      - ".github/workflows/fuel-worker-check.yml"
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/fuel-chatgpt-api/package-lock.json
      - run: npm ci
        working-directory: cloudflare/fuel-chatgpt-api
      - run: npm run dry-run
        working-directory: cloudflare/fuel-chatgpt-api
